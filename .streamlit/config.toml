# Theme values mirror tieout/theme.py (PRD 6.11); a test keeps them equal.

[server]
maxUploadSize = 50
enableStaticServing = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0F6E63"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16202E"
linkColor = "#0F6E63"
borderColor = "#E3DED4"
showWidgetBorder = true
baseRadius = "8px"
font = "IBM Plex Sans, sans-serif"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Serif"
url = "app/static/fonts/IBMPlexSerif-SemiBold.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = "400"
style = "normal"
