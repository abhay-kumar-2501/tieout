name: PR conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9-]+\))?!?: [a-z0-9].{0,71}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title OK: $TITLE"
          else
            echo "::error::PR title must look like 'feat(scope): summary' (max 72-char summary). See CONTRIBUTING.md."
            exit 1
          fi
